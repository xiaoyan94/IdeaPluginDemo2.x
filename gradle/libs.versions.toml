[versions]
# library versions
okhttp = "4.12.0"
fastjson = "2.0.28"
freemarker = "2.3.33"
mysqlConnector = "8.2.0"
poi = "5.4.0"

# test libraries
junit = "4.13.2"
opentest4j = "1.3.0"

# plugins
changelog = "2.4.0"
intelliJPlatform = "2.5.0"
kotlin = "2.1.20"
kover = "0.9.1"
qodana = "2024.3.4"

[libraries]
# regular libraries
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
fastjson = { group = "com.alibaba", name = "fastjson", version.ref = "fastjson" }
freemarker = { group = "org.freemarker", name = "freemarker", version.ref = "freemarker" }
mysqlConnector = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysqlConnector" }
poiOoxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "poi" }

# test libraries
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
